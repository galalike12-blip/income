<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A84FF" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <title>Income Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force unregister all service workers and clear caches for this origin
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('SW unregistered during force-cleanup');
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
          console.log('Caches cleared during force-cleanup');
        });
      }
      // Also clear Firestore IndexedDB if any remains (though we use memory cache now)
      try {
        window.indexedDB.deleteDatabase('firestore/[DEFAULT]/my-income-tracker-6a372/main');
        window.indexedDB.deleteDatabase('firebase-messaging-database');
      } catch (e) {}
    </script>
  </body>
</html>
