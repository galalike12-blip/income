<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Income" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json?v=2" />
    <title>Income & Tip Tracker</title>
    <meta name="description" content="Calculate daily income, tips, deductions, and percentages with an AI assistant." />
    <meta property="og:title" content="Income & Tip Tracker" />
    <meta property="og:description" content="Calculate daily income, tips, deductions, and percentages with an AI assistant." />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.JSON) {
          var nativeStringify = window.JSON.stringify;
          var isPatchedKey = Symbol.for('__isCircularSafeStringify__');
          if (!nativeStringify[isPatchedKey]) {
            var safeStringifyGlobal = function(value, replacer, space) {
              var isFn = typeof replacer === 'function';
              var isArr = Array.isArray(replacer);
              var seen = new WeakSet();
              var wrappedReplacer = function(key, val) {
                if (typeof val === 'object' && val !== null) {
                  if (seen.has(val)) return undefined;
                  seen.add(val);
                  if (typeof val.toDate === 'function') {
                    try { return val.toDate().toISOString(); } catch (e) {}
                  }
                  if (val.firestore && typeof val.path === 'string') {
                    return val.path;
                  }
                }
                if (isFn) return replacer.call(this, key, val);
                return val;
              };
              try {
                if (isArr) return nativeStringify.call(window.JSON, value, replacer, space);
                return nativeStringify.call(window.JSON, value, wrappedReplacer, space);
              } catch (err) {
                try {
                  var fallbackSeen = new WeakSet();
                  return nativeStringify.call(window.JSON, value, function(k, v) {
                    if (typeof v === 'object' && v !== null) {
                      if (fallbackSeen.has(v)) return undefined;
                      fallbackSeen.add(v);
                    }
                    return v;
                  }, space);
                } catch (e2) {
                  return typeof value === 'object' && value !== null ? (Array.isArray(value) ? '[]' : '{}') : '""';
                }
              }
            };
            safeStringifyGlobal[isPatchedKey] = true;
            window.JSON.stringify = safeStringifyGlobal;
          }
        }
      })();
    </script>
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        transition: opacity 0.5s ease;
      }
      .loader-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .progress-container {
        width: 200px;
        height: 4px;
        background-color: #e2e8f0;
        border-radius: 9999px;
        overflow: hidden;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background-color: #0A84FF;
        border-radius: 9999px;
        animation: progress 1.5s ease-out forwards;
      }
      @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 95%; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: .7; transform: scale(0.95); }
      }
      @media (prefers-color-scheme: dark) {
        #app-loader { background-color: #0f172a; }
        .progress-container { background-color: #1e293b; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loader">
      <img src="/icon.svg" class="loader-icon" alt="Loading" />
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('SW registered: ', registration);
          }).catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
      // Clear old DBs but don't kill SW here. The React app will fade out the loader.
      try {
        window.indexedDB.deleteDatabase('firestore/[DEFAULT]/my-income-tracker-6a372/main');
        window.indexedDB.deleteDatabase('firebase-messaging-database');
      } catch (e) {}
    </script>
  </body>
</html>
