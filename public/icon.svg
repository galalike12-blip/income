<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="50%" style="stop-color:#a855f7" />
      <stop offset="100%" style="stop-color:#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="15" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Background (Liquid) -->
  <rect width="512" height="512" rx="120" fill="url(#liquid)" />
  
  <!-- Glass Layer -->
  <rect x="80" y="80" width="352" height="352" rx="80" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" filter="url(#shadow)" transform="rotate(-2, 256, 256)" />
  
  <!-- Wallet Icon -->
  <g transform="translate(136, 136) scale(10)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12V7H5a2 2 0 0 1 2-2h14v4" />
    <path d="M3 10h18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2z" />
    <line x1="16" y1="17" x2="20" y2="17" />
  </g>
  
  <!-- Shine Effect on Glass -->
  <rect x="80" y="80" width="352" height="176" rx="80" fill="url(#glassShine)" transform="rotate(-2, 256, 256)" pointer-events="none" />
</svg>
